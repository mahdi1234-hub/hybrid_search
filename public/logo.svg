<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <!-- Inner glow -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="white" fill-opacity="0.08"/>
  <!-- Letter S -->
  <text x="256" y="340" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="280" font-weight="800" fill="white" letter-spacing="-8">S</text>
  <!-- AI sparkle dot top-right -->
  <circle cx="380" cy="120" r="18" fill="url(#sparkle)"/>
  <circle cx="380" cy="120" r="8" fill="white"/>
  <!-- Small accent dots -->
  <circle cx="400" cy="100" r="6" fill="white" fill-opacity="0.5"/>
  <circle cx="360" cy="100" r="4" fill="white" fill-opacity="0.3"/>
</svg>
